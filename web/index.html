<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disc Two</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<style>
  /* Inspired by 2000s DVD menus, not imitating them. What that era got right
     was structure: a dark field, wide-tracked capitals, thin rules dividing
     sections, one warm accent, and a marker showing what is selected rather
     than a filled block. What it got wrong — chrome bevels, glass gradients,
     drop shadows on everything — is left behind. Dark only, on purpose: these
     menus were never light, and committing to it keeps the palette coherent. */
  :root {
    --bg:#0b0e14; --panel:#121722; --raise:#161d2b; --edge:#222b3b;
    --ink:#e8eaf0; --dim:#7d8798; --accent:#d4a24c; --accent-dim:#8a6a33;
    --ok:#6fbf8b; --warn:#d4a24c; --bad:#d1656a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.6 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:2.5rem 1.25rem 5rem; }

  /* Title block: the one place the era shows plainly. */
  header { display:flex; align-items:center; gap:.85rem; margin-bottom:.4rem; }
  header img { width:34px; height:34px; flex:0 0 auto; }
  h1 { font-size:1.05rem; margin:0; font-weight:400; letter-spacing:.34em;
       text-transform:uppercase; }
  .tag { color:var(--dim); font-size:.72rem; letter-spacing:.18em;
         text-transform:uppercase; margin-left:.1rem; }
  .rule { height:1px; background:linear-gradient(90deg,var(--accent),transparent);
          margin:1.1rem 0 1.4rem; opacity:.55; }

  .rail { display:flex; gap:1.4rem; flex-wrap:wrap; color:var(--dim);
          font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
          margin-bottom:2.2rem; }
  .rail b { color:var(--ink); font-weight:500; letter-spacing:0;
            text-transform:none; }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%;
         background:var(--edge); margin-right:.45rem; vertical-align:middle; }
  .dot.on { background:var(--accent); box-shadow:0 0 6px var(--accent-dim); }

  h2 { font-size:.68rem; text-transform:uppercase; letter-spacing:.24em;
       color:var(--accent); font-weight:400; margin:2.4rem 0 .5rem;
       padding-bottom:.5rem; border-bottom:1px solid var(--edge); }

  /* A row is a menu entry: flat until you point at it, then a marker appears
     on the left. No fills, no lifts. */
  .card { background:var(--panel); border:1px solid var(--edge); border-left:2px solid transparent;
          padding:.8rem 1rem; margin-bottom:2px; transition:border-color .12s,background .12s; }
  .card:hover { background:var(--raise); border-left-color:var(--accent); }
  .disc { display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; }
  .disc .nm { flex:1 1 14rem; min-width:0; word-break:break-word; }
  .disc .sub { color:var(--dim); font-size:.78rem; display:block; }
  .num { font-variant-numeric:tabular-nums; color:var(--dim); font-size:.78rem;
         letter-spacing:.04em; }
  .empty { color:var(--dim); font-style:italic; }

  button { background:transparent; color:var(--accent); border:1px solid var(--accent-dim);
           border-radius:2px; padding:.42rem .95rem; font:inherit; font-size:.72rem;
           font-weight:500; letter-spacing:.14em; text-transform:uppercase;
           cursor:pointer; white-space:nowrap; transition:.12s; }
  button:hover { background:var(--accent); color:var(--bg); }
  button.ghost { color:var(--dim); border-color:var(--edge); }
  button.ghost:hover { background:transparent; color:var(--ink); border-color:var(--dim); }

  .pill { display:inline-block; padding:.08rem .5rem; border:1px solid currentColor;
          border-radius:2px; font-size:.62rem; font-weight:500; letter-spacing:.12em;
          text-transform:uppercase; margin-left:.5rem; vertical-align:middle; }
  .pill.todo { color:var(--accent); } .pill.done { color:var(--ok); }
  .pill.bad { color:var(--bad); } .pill.busy { color:var(--dim); }

  .modal { position:fixed; inset:0; background:rgba(4,6,10,.82); display:none;
           align-items:flex-start; justify-content:center; padding:2rem 1rem;
           overflow-y:auto; z-index:20; }
  .modal.on { display:flex; }
  .sheet { background:var(--panel); border:1px solid var(--edge); border-top:2px solid var(--accent);
           padding:1.6rem; width:100%; max-width:46rem; }
  .sheet h3 { margin:0 0 .5rem; font-size:.82rem; font-weight:400; letter-spacing:.2em;
              text-transform:uppercase; color:var(--accent); }
  .hint { color:var(--dim); font-size:.82rem; margin-bottom:1.1rem; }

  .pick { display:flex; gap:.8rem; align-items:center; padding:.55rem .7rem;
          border:1px solid var(--edge); border-left:2px solid transparent;
          margin-bottom:2px; cursor:pointer; background:var(--bg); }
  .pick:hover { border-left-color:var(--accent-dim); }
  .pick.sel { border-left-color:var(--accent); background:var(--raise); }
  .pick img { width:34px; height:51px; object-fit:cover; background:var(--edge); flex:0 0 auto; }
  .pick b { display:block; font-size:.88rem; font-weight:500; }
  .pick small { color:var(--dim); font-size:.74rem; }

  .row { display:flex; gap:.55rem; align-items:center; padding:.42rem 0;
         border-bottom:1px solid var(--edge); }
  .row:last-of-type { border-bottom:0; }
  input[type=text], input[type=search], select {
    background:var(--bg); border:1px solid var(--edge); color:var(--ink);
    border-radius:2px; padding:.4rem .55rem; font:inherit; font-size:.82rem; min-width:0; }
  input[type=text] { flex:1; }
  input:focus, select:focus { outline:1px solid var(--accent); outline-offset:-1px; }
  select { flex:0 0 auto; max-width:10rem; font-size:.76rem; }
  .dur { color:var(--dim); font-size:.75rem; font-variant-numeric:tabular-nums;
         min-width:4.6rem; letter-spacing:.04em; }
  .src { font-size:.6rem; font-weight:500; padding:.05rem .35rem; border:1px solid currentColor;
         border-radius:2px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; }
  .src.db { color:var(--ok); } .src.ai { color:var(--accent); }

  .btns { display:flex; gap:.5rem; margin-top:1.4rem; flex-wrap:wrap; }
  .log { background:var(--bg); border:1px solid var(--edge); padding:.7rem .85rem;
         font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.73rem;
         max-height:15rem; overflow:auto; white-space:pre-wrap; margin-top:.8rem;
         color:var(--dim); }
  .toast { position:fixed; left:50%; bottom:1.5rem; transform:translateX(-50%);
           background:var(--accent); color:var(--bg); padding:.55rem 1.2rem;
           font-size:.72rem; font-weight:500; letter-spacing:.12em;
           text-transform:uppercase; opacity:0; pointer-events:none;
           transition:opacity .25s; z-index:30; }
  .toast.on { opacity:1; }
  footer { color:var(--dim); font-size:.72rem; margin-top:3.5rem; text-align:center;
           letter-spacing:.06em; }
  footer a { color:var(--accent-dim); text-decoration:none; }
  footer a:hover { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/static/logo.svg" alt="">
    <div><h1>Disc Two</h1>
      <div class="tag">special features, filed properly</div></div>
  </header>
  <div class="rule"></div>
  <div class="rail" id="rail"></div>

  <h2>Discs</h2>
  <div id="discs"><div class="card empty">looking for ISOs…</div></div>

  <h2>Catalogue</h2>
  <div id="catalogue"></div>

  <footer>Disc Two reads ISOs — it never modifies, moves or deletes one.<br>
    <a href="https://github.com/mfbergmann/disc-two" target="_blank" rel="noopener">github.com/mfbergmann/disc-two</a>
  </footer>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gb = b => b >= 1e9 ? (b/1e9).toFixed(2)+' GB' : (b/1e6).toFixed(0)+' MB';
const PLEX_DIRS = ['Featurettes','Behind The Scenes','Deleted Scenes','Interviews',
                   'Scenes','Shorts','Trailers','Other'];
let RV = null, STATE = {};

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2600); }
async function post(url, body){
  try { const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)}); const d = await r.json();
    if (d.error) { toast(d.error); return null; } return d; }
  catch { toast('request failed'); return null; }
}
const openSheet = h => { $('#sheet').innerHTML = h; $('#modal').classList.add('on'); };
const closeSheet = () => $('#modal').classList.remove('on');

const PILL = {new:['todo','needs review'], inspected:['todo','needs review'],
  scanning:['busy','reading…'], importing:['busy','importing…'],
  imported:['done','in library'], failed:['bad','failed'], skipped:['',''] };

function draw(){
  const v = STATE.vision||{}, r = STATE.radarr||{}, c = STATE.discdb||{};
  $('#rail').innerHTML = [
    `<span><span class="dot ${r.reachable?'on':'off'}"></span>Radarr ${r.reachable?`<b>${r.movies}</b> films`:'not connected'}</span>`,
    `<span><span class="dot ${c.synced?'on':'off'}"></span>Catalogue ${c.synced?`<b>${c.discs}</b> discs`:'not downloaded'}</span>`,
    `<span><span class="dot ${(STATE.sonarr||{}).reachable?'on':'off'}"></span>Sonarr ${(STATE.sonarr||{}).reachable?`<b>${STATE.sonarr.series}</b> shows`:'not connected'}</span>`,
    `<span><span class="dot ${v.available?'on':'off'}"></span>Vision ${v.available?`<b>${esc(v.model||'')}</b>${v.loaded?' · warm':''}`:'tesseract only'}</span>`,
  ].join('');

  const isos = STATE.isos||[];
  $('#discs').innerHTML = isos.length ? isos.map(i => {
    const [cls,label] = PILL[i.review] || ['',''];
    return `<div class="card disc">
      <span class="nm">${esc(i.name)}
        ${label?`<span class="pill ${cls}">${label}</span>`:''}
        <span class="sub">${i.movie?esc(i.movie)+' ('+esc(i.year)+')':'&nbsp;'}</span></span>
      <span class="num">${gb(i.size)}</span>
      <button onclick="review('${esc(i.rel)}')">${i.review==='imported'?'Re-import':'Identify &amp; import'}</button>
    </div>`; }).join('')
    : `<div class="card empty">No ISOs found in ${esc(STATE.iso_dir||'')}. Mount some and they appear here.</div>`;

  $('#catalogue').innerHTML = `<div class="card disc">
    <span class="nm">TheDiscDb${c.synced?` — <b>${c.discs}</b> DVDs indexed`:' — not downloaded'}
      <span class="sub">exact disc identification and real extra names</span></span>
    <button class="ghost" onclick="syncDb()">${c.synced?'Refresh':'Download'}</button></div>`;
}

async function refresh(){
  try { STATE = await (await fetch('/api/status')).json(); draw(); } catch {}
}

async function review(rel){
  RV = {rel};
  openSheet(`<h3>Reading the disc…</h3><div class="hint">Listing titles and identifying it.</div>`);
  let d; try { d = await (await fetch('/api/inspect?rel='+encodeURIComponent(rel))).json(); }
  catch { d = null; }
  if (!d || d.error) return openSheet(
    `<h3>Could not read that disc</h3><div class="hint">${esc(d?.error||'no answer')}</div>
     <div class="btns"><button class="ghost" onclick="closeSheet()">Close</button></div>`);
  RV.data = d; RV.chosen = d.suggestion || null; drawReview();
}

let SHOWN = [];
const chooseMovie = i => { RV.chosen = SHOWN[i]; drawReview(); };
const namedCount = d => (d.extras||[]).filter(t => t.source && t.source!=='placeholder').length;

function drawReview(){
  const d = RV.data;
  if (d.kind === 'episodes') return drawEpisodes();
  const c = RV.chosen, db = d.discdb || {};
  SHOWN = d.suggestion ? [d.suggestion, ...d.candidates.filter(x=>x.tmdbId!==d.suggestion.tmdbId)]
                       : d.candidates.slice();
  if (c && !SHOWN.some(m=>m.tmdbId===c.tmdbId)) SHOWN.unshift(c);
  const isNew = c && !c.in_library;

  openSheet(`
    <h3>${d.suggestion?'Is this the right film?':'Which film is this?'}</h3>
    <div class="hint"><b>${esc(d.iso.split('/').pop())}</b> — feature ${esc(d.feature.duration)},
      ${d.extras.length} extra${d.extras.length===1?'':'s'}.
      ${db.matched?`Identified from the catalogue (${db.how==='contenthash'?'exact disc match':'runtime guess'}).`
                  :'Not in the catalogue — names below are placeholders.'}</div>

    ${SHOWN.map((m,i)=>`<div class="pick${c&&c.tmdbId===m.tmdbId?' sel':''}" onclick="chooseMovie(${i})">
      ${m.poster?`<img src="${esc(m.poster)}" alt="" loading="lazy">`:'<img alt="">'}
      <div><b>${esc(m.title)} (${esc(m.year)})</b>
      <small>${m.in_library?'in your library':'not in library — will be added to Radarr'}</small></div>
    </div>`).join('') || '<div class="hint">No candidates — search below.</div>'}

    <div class="row" style="border:0">
      <input type="search" id="q" placeholder="search by title, e.g. Alien 3 1992"
             value="${esc(RV.search ?? d.guess ?? '')}"
             onkeydown="if(event.key==='Enter')doSearch()">
      <button class="ghost" onclick="doSearch()">Search</button>
    </div>

    ${c ? `
      <div class="hint" style="margin:1.1rem 0 .3rem">
        ${isNew ? `<b>${esc(c.title)}</b> isn't in the library. It'll be added to Radarr so
                   Radarr names the folder, then the main title is imported with the extras.`
                : `Extras go to <b>${esc(c.path)}/</b>. Your existing film file is untouched.`}
      </div>
      <label class="row" style="border:0">
        <input type="checkbox" id="feat" ${isNew?'checked':''}>
        <span style="flex:1;font-size:.85rem">Also import the main feature (${esc(d.feature.duration)})</span>
      </label>
      <div class="hint" style="margin:.9rem 0 .2rem">
        ${namedCount(d)?`<b>${namedCount(d)}</b> of ${d.extras.length} named automatically — check them.`
                       :'Name these from the disc menu or the case, then import.'}</div>
      ${d.extras.map((t,i)=>`<label class="row">
        <input type="checkbox" ${t.include?'checked':''} id="inc${i}">
        <span class="dur">${esc(t.duration)}</span>
        <input type="text" id="nm${i}" value="${esc(t.name)}">
        <select id="dir${i}">${PLEX_DIRS.map(x=>`<option${x===(t.subdir||'Featurettes')?' selected':''}>${x}</option>`).join('')}</select>
        ${t.source==='thediscdb'?'<span class="src db">db</span>'
          :t.source==='vision'||t.source==='menu'?'<span class="src ai">menu</span>'
          :t.source==='cover'?'<span class="src ai">box</span>':''}
      </label>`).join('') || '<div class="hint">No extras detected.</div>'}
      ${d.skipped.length?`<div class="hint" style="margin-top:.7rem"><b>Skipped:</b> ${
        d.skipped.map(s=>`title ${s.ix} (${esc(s.duration)}) — ${esc(s.reason)}`).join('; ')}</div>`:''}
    ` : ''}

    <div class="btns">
      ${c?`<button onclick="doImport()">${isNew?'Add to Radarr &amp; import':'Import extras'}</button>`:''}
      ${!db.matched?`<label class="ghost" style="display:inline-flex;align-items:center;
         border:1px solid var(--edge);border-radius:7px;padding:.45rem .9rem;
         font-size:.85rem;color:var(--dim);cursor:pointer">Read the case back
         <input type="file" accept="image/*" capture="environment" style="display:none"
                onchange="coverPhoto(this)"></label>
       <button class="ghost" onclick="menuScan()">Read the disc menu</button>`:''}
      ${c&&!db.matched?`<button class="ghost" onclick="contribute()">Contribute to TheDiscDb</button>`:''}
      <button class="ghost" onclick="closeSheet()">Cancel</button>
    </div>`);
}

// A box set is a different question: not "which film and what are the extras"
// but "which show, which season, and which episode is each title".
function drawEpisodes(){
  const d = RV.data, s = RV.series || d.series;
  SHOWN = d.candidates || [];
  openSheet(`
    <h3>This looks like a TV box set</h3>
    <div class="hint"><b>${esc(d.iso.split('/').pop())}</b> — ${esc(d.reason)}.
      ${d.playall.length?`Ignoring ${d.playall.length} play-all title${d.playall.length===1?'':'s'}.`:''}
      ${d.discdb&&d.discdb.matched?'Episode numbers come from the catalogue.':
        'Episode numbers are a running sequence — set the first one and the rest follow.'}</div>

    ${SHOWN.map((m,i)=>`<div class="pick${s&&s.id===m.id?' sel':''}" onclick="chooseSeries(${i})">
      ${m.poster?`<img src="${esc(m.poster)}" alt="" loading="lazy">`:'<img alt="">'}
      <div><b>${esc(m.title)}</b><small>${(m.seasons||[]).length} seasons in Sonarr</small></div>
    </div>`).join('') || '<div class="hint">No series matched — search below.</div>'}

    <div class="row" style="border:0">
      <input type="search" id="q" placeholder="search your shows, e.g. Buffy"
             value="${esc(RV.search ?? d.guess ?? '')}"
             onkeydown="if(event.key==='Enter')doSearchSeries()">
      <button class="ghost" onclick="doSearchSeries()">Search</button>
    </div>

    ${s ? `
      <div class="row" style="border:0;margin-top:.9rem">
        <span style="font-size:.85rem">Season</span>
        <select id="season" onchange="reNumber()" style="max-width:7rem">
          ${(s.seasons||[]).filter(n=>n>0).map(n=>`<option${n===(RV.season??d.season)?' selected':''}>${n}</option>`).join('')}
        </select>
        <span style="font-size:.85rem;margin-left:.6rem">First episode on this disc</span>
        <input type="text" id="firstEp" value="${esc(RV.first ?? (d.episodes[0]||{}).number ?? 1)}"
               style="max-width:4rem" oninput="reNumber()">
      </div>
      <div class="hint" style="margin:.8rem 0 .2rem">
        Titles land in <b>${esc(s.path)}/Season ${String(RV.season??d.season??1).padStart(2,'0')}/</b>.
        Sonarr renames them to your format when it imports.</div>
      ${d.episodes.map((e,i)=>`<label class="row">
        <input type="checkbox" ${e.include?'checked':''} id="einc${i}">
        <span class="dur">${esc(e.duration)}</span>
        <span style="width:4.2rem;font-size:.8rem;color:var(--dim)">E${String(e.number).padStart(2,'0')}</span>
        <input type="text" id="etitle${i}" value="${esc(e.title||'')}"
               placeholder="Sonarr's episode title is used if blank">
        ${e.source==='thediscdb'?'<span class="src db">db</span>':''}
      </label>`).join('')}
    ` : ''}

    <div class="btns">
      ${s?`<button onclick="importEpisodes()">Import ${d.episodes.filter(e=>e.include).length} episodes</button>`:''}
      <button class="ghost" onclick="treatAsFilm()">It's a film, not a box set</button>
      <button class="ghost" onclick="closeSheet()">Cancel</button>
    </div>`);
}

const chooseSeries = i => { RV.series = SHOWN[i]; drawEpisodes(); };

function reNumber(){
  const first = parseInt((document.getElementById('firstEp')||{}).value, 10);
  const season = parseInt((document.getElementById('season')||{}).value, 10);
  if (!isNaN(season)) RV.season = season;
  if (!isNaN(first)) {
    RV.first = first;
    RV.data.episodes.forEach((e,i)=>{ e.number = first + i; });
  }
  drawEpisodes();
}

async function doSearchSeries(){
  const q=(document.getElementById('q')||{}).value||'';
  if(q.trim().length<2) return toast('type at least two characters');
  RV.search=q; toast('searching…');
  let r; try{ r=await (await fetch('/api/search?q='+encodeURIComponent(q))).json(); }
  catch{ return toast('search failed'); }
  RV.data.candidates = r.series || [];
  drawEpisodes();
}

function readEpisodeEdits(){
  (RV.data.episodes||[]).forEach((e,i)=>{
    const t=document.getElementById('etitle'+i), c=document.getElementById('einc'+i);
    if(t) e.title=t.value; if(c) e.include=c.checked;
  });
}

async function importEpisodes(){
  readEpisodeEdits();
  const d=RV.data, s=RV.series||d.series;
  const season = RV.season ?? d.season ?? 1;
  const r = await post('/api/import-episodes', {rel:RV.rel, seriesId:s.id, season,
    episodes:d.episodes.map(e=>({ix:e.ix,seconds:e.seconds,chapters:e.chapters,
      number:e.number,title:e.title,include:e.include}))});
  if(!r) return; RV.job=r.job; pollJob();
}

// Detection is a suggestion. If it got the shape wrong, say so and the film
// path takes over.
function treatAsFilm(){
  RV.data.kind='movie'; RV.data.extras=RV.data.extras||RV.data.episodes.map(e=>({
    ix:e.ix,duration:e.duration,seconds:e.seconds,chapters:e.chapters,
    include:true,name:'Featurette',subdir:'Featurettes',source:'placeholder'}));
  RV.data.feature=RV.data.feature||{ix:RV.data.episodes[0].ix,
    duration:RV.data.episodes[0].duration,seconds:RV.data.episodes[0].seconds,chapters:0};
  RV.data.suggestion=null; RV.data.candidates=[]; RV.chosen=null;
  toast('treating it as a film — pick the title');
  drawReview();
}

function readEdits(){
  (RV.data.extras||[]).forEach((t,i)=>{
    const n=document.getElementById('nm'+i), c=document.getElementById('inc'+i),
          d=document.getElementById('dir'+i);
    if(n) t.name=n.value; if(c) t.include=c.checked; if(d) t.subdir=d.value;
  });
}

async function doSearch(){
  const q=(document.getElementById('q')||{}).value||'';
  if(q.trim().length<2) return toast('type at least two characters');
  RV.search=q; readEdits(); toast('searching…');
  let r; try{ r=await (await fetch('/api/search?q='+encodeURIComponent(q))).json(); }catch{ return toast('search failed'); }
  if(r.error) return toast(r.error);
  const seen=new Set();
  RV.data.candidates=[...(r.library||[]),...(r.tmdb||[])].filter(m=>!seen.has(m.tmdbId)&&seen.add(m.tmdbId));
  RV.data.suggestion=null; drawReview();
}

async function doImport(){
  readEdits();
  const d=RV.data, feat=document.getElementById('feat');
  const r = await post('/api/import',{rel:RV.rel, tmdbId:RV.chosen.tmdbId,
    includeFeature:!!(feat&&feat.checked), featureIx:d.feature.ix,
    featureSeconds:d.feature.seconds,
    extras:d.extras.map(t=>({ix:t.ix,name:t.name,seconds:t.seconds,
      chapters:t.chapters,subdir:t.subdir,include:t.include}))});
  if(!r) return;
  if(r.created_movie) toast('added to Radarr');
  RV.job=r.job; pollJob();
}

async function pollJob(){
  let j; try{ j=await (await fetch('/api/job?id='+encodeURIComponent(RV.job))).json(); }catch{ j=null; }
  if(!j) return setTimeout(pollJob,2500);
  const done = j.status==='done'||j.status==='failed';
  openSheet(`<h3>${done?(j.status==='done'?'Imported':'Finished with errors'):'Importing…'}</h3>
    <div class="hint">${esc((j.movie&&j.movie.title)||'')}${j.encoder?' · '+esc(j.encoder):''}
      ${j.total?` · ${j.done||0}/${j.total}`:''}${j.current?'<br>encoding '+esc(j.current):''}</div>
    <div class="log">${(j.log||[]).map(esc).join('\n')||'starting…'}</div>
    <div class="btns"><button class="ghost" onclick="closeSheet()">${done?'Close':'Run in background'}</button></div>`);
  if(!done) setTimeout(pollJob,2500); else refresh();
}

async function coverPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  readEdits(); toast('reading the case…');
  let r; try{ r=await fetch('/api/cover?rel='+encodeURIComponent(RV.rel),
    {method:'POST',body:f}).then(x=>x.json()); }catch{ return toast('upload failed'); }
  input.value='';
  if(!(r.names||[]).length) return toast(r.error||'nothing found on it');
  RV.names=r.names; showNames('the case back',
    'The case says how they are spelled. It cannot say which title each one is — check the pairing.');
}

async function menuScan(){
  readEdits();
  const r=await post('/api/menu-scan',{rel:RV.rel}); if(!r) return;
  RV.job=r.job; pollMenu();
}
async function pollMenu(){
  let j; try{ j=await (await fetch('/api/job?id='+encodeURIComponent(RV.job))).json(); }catch{ j=null; }
  if(!j) return setTimeout(pollMenu,3000);
  const done=j.status==='done'||j.status==='failed';
  openSheet(`<h3>${done?(j.status==='done'?'Read from the menu':'Could not read the menu'):'Reading the disc menu…'}</h3>
    <div class="hint">Rendering each menu and reading its labels.${j.error?' '+esc(j.error):''}</div>
    <div class="log">${(j.log||[]).map(esc).join('\n')||'starting…'}</div>
    <div class="btns">${done&&(j.names||[]).length?
      `<button onclick="RV.names=(${JSON.stringify(j.names||[]).replace(/"/g,'&quot;')}).map(n=>n.label||n);applyNames()">Use these names</button>`:''}
      <button class="ghost" onclick="drawReview()">Back</button></div>`);
  if(!done) setTimeout(pollMenu,3000);
}

function showNames(where, caveat){
  openSheet(`<h3>Read from ${esc(where)}</h3>
    <div class="hint">${esc(caveat)}</div>
    <div class="log">${RV.names.map((n,i)=>esc((i+1)+'. '+n)).join('\n')}</div>
    <div class="btns"><button onclick="applyNames()">Use these names, in order</button>
      <button class="ghost" onclick="drawReview()">Back</button></div>`);
}

function applyNames(){
  const names=RV.names||[];
  RV.data.extras.forEach((t,i)=>{ if(i<names.length){ t.name=names[i]; t.source='cover'; }});
  toast(`applied ${Math.min(names.length,RV.data.extras.length)} names — check the pairing`);
  drawReview();
}

async function contribute(){
  readEdits(); const d=RV.data,c=RV.chosen;
  const r=await post('/api/contribute',{rel:RV.rel,
    movie:{title:c.title,year:c.year,tmdbId:c.tmdbId},
    featureIx:d.feature.ix, featureSeconds:d.feature.seconds, featureChapters:d.feature.chapters,
    extras:d.extras.map(t=>({ix:t.ix,seconds:t.seconds,chapters:t.chapters,
      name:t.name,subdir:t.subdir,include:t.include}))});
  if(!r) return;
  openSheet(`<h3>Submission written</h3>
    <div class="hint">${r.named} of ${r.titles} titles named, keyed on <code>${esc(r.content_hash)}</code>.</div>
    <div class="log">${esc(r.release_dir)}</div>
    <div class="hint" style="margin-top:.8rem">Fork <b>github.com/TheDiscDb/data</b>, copy that
      <code>data/</code> tree in, open a pull request. Check the names against the packaging first —
      a wrong name in a shared catalogue is worse than a gap.</div>
    <div class="btns"><button class="ghost" onclick="closeSheet()">Close</button></div>`);
}

async function syncDb(){ const r=await post('/api/discdb-sync',{}); if(!r) return;
  RV={job:r.job}; toast('fetching the catalogue…'); pollJob(); }

refresh(); setInterval(refresh, 4000);
</script>
</body>
</html>
